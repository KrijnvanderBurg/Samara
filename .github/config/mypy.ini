[mypy]
disable_error_code = type-abstract
; excludes separated by |, anything else excludes whole root folder
exclude = build|tests|docs|.devcontainer|.azuredevops|.github

; Only these third-party packages lack type stubs; everything else is checked.
[mypy-yaml.*]
ignore_missing_imports = True

[mypy-pyjson5.*]
ignore_missing_imports = True

[mypy-pyspark.*]
ignore_missing_imports = True
